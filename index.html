<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>softies</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#3b2a3f;--muted:#6a566f;--pink:#ffd9e6;--lav:#e9e0ff;--accent:#b8336f;--on:#fff;--line:#f0dfe6;--star:#d98a00;--shadow:0 6px 18px rgba(120,60,90,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22182a;--card:#2f2339;--ink:#fdf1f6;--muted:#cdb9d4;--pink:#5a2c45;--lav:#3a2e5c;--accent:#ff8fbd;--on:#2a1230;--line:#443555;--star:#ffc24a;--shadow:0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header svg{width:40px;height:50px}
h1{margin:0;font-size:2.1rem;letter-spacing:-.5px;line-height:1}
.sub{margin:0;color:var(--muted);font-size:.92rem}
h2{margin:0 0 8px;font-size:1.2rem}
section{margin-top:24px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.hero{background:linear-gradient(160deg,var(--pink),var(--lav));display:flex;align-items:center;gap:16px;padding:22px 20px}
.hero svg{width:92px;height:120px;flex:none}
.eyebrow{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{margin:2px 0;font-size:2.1rem;line-height:1.05;font-weight:900;overflow-wrap:anywhere}
.stars{display:flex;gap:2px;margin-top:6px}
.stars button,.stars span{font-size:1.9rem;line-height:1;color:var(--star);background:none;border:0;padding:0;min-width:44px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stars span{font-size:1rem;min-width:0;min-height:0;cursor:default}
.stars.sm{margin:0;gap:0}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:14px;background:var(--accent);color:var(--on);font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink);min-height:44px;padding:0 12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol,ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.row .dot{width:16px;height:16px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}
.row b{display:block;overflow-wrap:anywhere}
.row small{color:var(--muted)}
form{display:grid;gap:10px;margin-bottom:12px}
label{font-weight:700;font-size:.9rem;display:grid;gap:4px}
select,input{min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 10px;width:100%}
.empty{color:var(--muted);text-align:center;padding:14px}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg viewBox="0 0 100 130" aria-hidden="true"><polygon points="28,62 72,62 50,124" fill="#e6b36a"/><ellipse cx="50" cy="58" rx="30" ry="12" fill="#ff9fc2"/><ellipse cx="50" cy="44" rx="24" ry="11" fill="#fff6e6"/><ellipse cx="50" cy="31" rx="18" ry="10" fill="#ff9fc2"/><path d="M50 8C58 16 56 22 50 24C44 22 42 16 50 8Z" fill="#fff6e6"/></svg>
  <div><h1>softies</h1><p class="sub">My soft-serve diary</p></div>
</header>
<main>
  <div class="card hero" aria-labelledby="name">
    <div id="cone"></div>
    <div>
      <p class="eyebrow">Today’s flavor</p>
      <p class="big" id="name"></p>
      <p class="sub" id="day"></p>
      <p class="sub" id="date"></p>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>Rate this flavor</h2>
    <div id="rate"></div>
    <p class="sub" id="rateTxt"></p>
    <button class="btn" id="logNow" style="margin-top:10px">🍦 I had this today</button>
  </div>

  <section aria-labelledby="upH">
    <h2 id="upH">Coming up</h2>
    <p class="sub" style="margin-bottom:8px">The shop rotates through 14 flavors, then starts over at Day 1.</p>
    <ol id="up"></ol>
  </section>

  <section aria-labelledby="logH">
    <h2 id="logH">Logbook</h2>
    <form id="form">
      <label>Flavor <select id="fl"></select></label>
      <label>When <input type="datetime-local" id="when"></label>
      <button class="btn" type="submit">Add to logbook</button>
    </form>
    <p class="sub" id="count" aria-live="polite" style="margin-bottom:8px"></p>
    <ul id="log"></ul>
  </section>
</main>
<footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   EDIT HERE. The shop’s 14-day rotation, in sign order (Day 1 first).
   Each item is [flavor name, swirl color]. After Day 14 it loops to Day 1.
   ===================================================================== */
const FLAVORS = [
  ["Black Currant","#7a4fa3"],["Strawberry","#ff8fb1"],["Pista","#a7d27a"],["Chocolate","#6b3f2a"],
  ["Grape","#9a7fd1"],["Lychee","#f4c15a"],["Butterscotch","#e8a33d"],["Greenapple","#9bd36b"],
  ["Mango","#ffb627"],["Coffee","#8a5a3c"],["Blueberry","#6fb4e8"],["Rosemilk","#f6a6c1"],
  ["Malai Kulfi","#e9b27a"],["Pineapple","#f2dc6b"]
];
const TWIST = "vanilla";                       // every flavor is twisted with this
// Anchor: on this date the shop served this Day number. Every other date is
// worked out from it. If the shop ever skips or resets the cycle, update it.
const ANCHOR = { date: "2026-10-26", day: 7 }; // 26 Oct 2026 = Day 7, Butterscotch
/* ================= end of editable data ================= */

const $ = id => document.getElementById(id);
const N = FLAVORS.length;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const utc = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
const fmt = (d,o) => d.toLocaleDateString(undefined,o);
const today = new Date(); today.setHours(0,0,0,0);
const [ay,am,ad] = ANCHOR.date.split("-").map(Number);
const idxFor = d => ((ANCHOR.day-1 + Math.round((utc(d)-Date.UTC(ay,am-1,ad))/864e5)) % N + N) % N;
const colorOf = name => (FLAVORS.find(f => f[0]===name) || [0,"#ff9fc2"])[1];

let canSave = true;
const load = (k,f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch(e){ canSave = false; return f; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ canSave = false; } };
let ratings = load("softies.ratings", {});
let log = load("softies.log", []);

function cone(c){
  return '<svg viewBox="0 0 100 130" aria-hidden="true"><polygon points="28,62 72,62 50,124" fill="#e6b36a"/><path d="M36 72L58 72M40 84L62 84M45 96L55 96" stroke="#c98f45" stroke-width="2"/><ellipse cx="50" cy="58" rx="30" ry="12" fill="'+c+'"/><ellipse cx="50" cy="44" rx="24" ry="11" fill="#fff6e6"/><ellipse cx="50" cy="31" rx="18" ry="10" fill="'+c+'"/><path d="M50 8C58 16 56 22 50 24C44 22 42 16 50 8Z" fill="#fff6e6"/></svg>';
}
function stars(r, pick){
  const w = document.createElement("div"); w.className = "stars"+(pick?"":" sm");
  if (!pick){ w.setAttribute("role","img"); w.setAttribute("aria-label","Rated "+r+" of 5"); }
  for (let i=1;i<=5;i++){
    const e = document.createElement(pick?"button":"span");
    e.textContent = i<=r ? "★" : "☆";
    if (pick){ e.type="button"; e.setAttribute("aria-label", i+(i>1?" stars":" star")); e.setAttribute("aria-pressed", i===r); e.onclick = () => pick(i); }
    w.append(e);
  }
  return w;
}
function li(cls, color, title, subtitle, extra){
  const r = document.createElement("li"); r.className = "row";
  const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = color;
  const t = document.createElement("div"); t.className = "t";
  const b = document.createElement("b"); b.textContent = title;
  const s = document.createElement("small"); s.textContent = subtitle;
  t.append(b,s); r.append(dot,t); if (extra) r.append(extra);
  return r;
}
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

function addLog(flavor, ts){
  log.push({ id: Date.now()+Math.random(), flavor, ts });
  save("softies.log", log); render();
}

function render(){
  const i = idxFor(today), [name,color] = FLAVORS[i];
  $("cone").innerHTML = cone(color);
  $("name").textContent = name;
  $("day").textContent = "Day "+(i+1)+" of "+N+" · × "+TWIST;
  $("date").textContent = fmt(today,{weekday:"long",day:"numeric",month:"long"});
  const r = ratings[name] || 0;
  $("rate").textContent = ""; 
  $("rate").append(stars(r, v => { ratings[name] = (ratings[name]===v ? 0 : v); save("softies.ratings", ratings); render(); }));
  $("rateTxt").textContent = r ? "Your rating: "+r+"/5 (tap the same star to clear)" : "Tap a star to rate "+name+".";

  const up = $("up"); up.textContent = "";
  for (let k=1;k<=N;k++){
    const d = addDays(today,k), j = idxFor(d), f = FLAVORS[j];
    const sub = (k===1 ? "Tomorrow · " : "")+fmt(d,{weekday:"short",day:"numeric",month:"short"})+" · Day "+(j+1);
    up.append(li("", f[1], f[0], sub, ratings[f[0]] ? stars(ratings[f[0]]) : null));
  }

  const ul = $("log"); ul.textContent = "";
  const sorted = [...log].sort((a,b) => b.ts-a.ts);
  $("count").textContent = sorted.length ? sorted.length+(sorted.length>1?" softies logged":" softie logged") : "";
  if (!sorted.length){ const e = document.createElement("li"); e.className="empty"; e.textContent = "Nothing logged yet. Your softies will show up here."; ul.append(e); }
  sorted.forEach(en => {
    const d = new Date(en.ts);
    const del = document.createElement("button"); del.type="button"; del.className="btn ghost"; del.textContent="Remove";
    del.setAttribute("aria-label","Remove "+en.flavor+" entry");
    del.onclick = () => { log = log.filter(x => x.id!==en.id); save("softies.log", log); render(); };
    ul.append(li("", colorOf(en.flavor), en.flavor, fmt(d,{weekday:"short",day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}), del));
  });
  $("foot").textContent = canSave ? "Saved on this device only. Just for you." : "This browser is blocking saving, so entries will be lost when you close the page.";
}

FLAVORS.forEach(f => { const o = document.createElement("option"); o.textContent = f[0]; o.value = f[0]; $("fl").append(o); });
$("fl").value = FLAVORS[idxFor(today)][0];
$("when").value = nowLocal(); $("when").max = nowLocal();
$("logNow").onclick = () => addLog(FLAVORS[idxFor(today)][0], Date.now());
$("form").onsubmit = e => {
  e.preventDefault();
  const t = $("when").value ? new Date($("when").value).getTime() : Date.now();
  addLog($("fl").value, t);
  $("when").value = nowLocal();
};
render();
</script>
</body>
  </html>
